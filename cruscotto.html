<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il tuo riepilogo | ViaLibera</title>
<meta name="description" content="Punti patente, scadenze e veicoli intestati a te in una sola pagina. Progetto didattico, dati di esempio.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b2f57">
<link rel="icon" href="favicon.svg?v=8" type="image/svg+xml">
<link rel="preload" href="assets/fonts/titillium-web-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css?v=8">
</head>
<body data-pagina="cruscotto" data-area="privata">
<div id="testata"></div>
<script src="assets/app.js?v=8"></script>

<main id="contenuto" tabindex="-1">
  <div class="contenitore pila">
    <div class="pila-xs">
      <h1 id="saluto">Buongiorno</h1>
      <p class="intro">La tua situazione al <span data-oggi></span>.</p>
    </div>

    <section class="pila-s" aria-labelledby="t-dafare">
      <h2 id="t-dafare">Da fare presto</h2>
      <div id="da-fare" class="pila-s"></div>
    </section>

    <div class="griglia griglia-2">
      <section class="pannello pannello-forte pila-s" aria-labelledby="t-punti">
        <h2 id="t-punti">Punti patente</h2>
        <p class="cifra"><strong data-saldo>19</strong><span>punti su 30</span></p>
        <p><span class="stato stato-ok"><svg class="icona" aria-hidden="true" focusable="false"><use href="#i-spunta"></use></svg>Patente valida</span></p>
        <p>Ultima variazione: 3 punti tolti il 20 novembre 2026, per eccesso di velocità.</p>
        <div class="bottoni"><a class="btn btn-secondario" href="punti.html">Vedi saldo e storico</a></div>
      </section>

      <section id="scadenze" class="pannello pila-s" aria-labelledby="t-scadenze">
        <h2 id="t-scadenze">Le mie scadenze</h2>
        <ul class="scadenze" id="lista-scadenze"></ul>
      </section>

      <section id="veicoli" class="pannello pila-s largo" aria-labelledby="t-veicoli">
        <h2 id="t-veicoli">I miei veicoli</h2>
        <ul class="veicoli" id="lista-veicoli"></ul>
      </section>
    </div>
  </div>
</main>

<div id="piede"></div>
</body>
</html>
